services:
  aicar:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aicar_sim
    ipc: host
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - ./simulator:/app/simulator
    environment:
      - PYTHONUNBUFFERED=1
      - DISPLAY=:99
      - AICAR_SIMULATOR_PATH=/app/simulator/AutoDRIVE Simulator.x86_64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["python", "-m", "src.ui.app"]
