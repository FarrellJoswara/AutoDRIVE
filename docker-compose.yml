# AutoDRIVE A/B compose
# A = sim (Unity Linux .x86_64, one process per container)
# B = brain (Python Layers 1–4; Mission Control hub + static UI on :8090)
#
#   docker compose up --build --scale sim=2
# Browser → http://localhost:8090  (Settings / Train / Live)
# Or train via CLI with --no-auto-launch against ports 4567+.

name: aicar

services:
  brain:
    build:
      context: .
      dockerfile: docker/Dockerfile.brain
    container_name: aicar_brain
    ipc: host
    ports:
      # Wide Socket.IO range for many parallel envs (widen both sides together).
      # Example for 32 envs: "4567-4598:4567-4598"
      - "4567-4582:4567-4582"
      # Mission Control (hub API + Vite static)
      - "8090:8090"
      # Optional in-B Vite HMR during Layer 4 dev:
      # - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./simulator:/app/simulator
      - ./assets:/app/assets
      # Lets Mission Control stop compose sims after training. Anyone with
      # access to the hub container effectively has Docker host control.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONUNBUFFERED=1
      - AICAR_IN_DOCKER=1
      - AICAR_COMPOSE_PROJECT=aicar
      - READY_PORT=8090
      - HUB_PORT=8090
      - HUB_URL=http://127.0.0.1:8090
      - "AICAR_SIMULATOR_PATH=/app/simulator/AutoDRIVE Simulator.x86_64"
    networks:
      - aicar
    # GPU on B by default (NVIDIA Container Toolkit / Docker Desktop GPU)
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Mission Control hub (replaces ready_stub.py)
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "src.layer4.hub.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8090",
      ]

  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    # No container_name — required for --scale sim=N
    volumes:
      - ./simulator:/app/simulator
    environment:
      - BRAIN_HOST=brain
      - BASE_PORT=4567
      - "AICAR_SIMULATOR_PATH=/app/simulator/AutoDRIVE Simulator.x86_64"
      # Optional: force a single port (disables hostname-based indexing):
      # - PORT=4567
      - DISPLAY=:99
    networks:
      - aicar
    depends_on:
      - brain
    # CPU / software GL by default. For GPU sims, either:
    #   docker compose -f docker-compose.yml -f docker-compose.sim-gpu.yml up --scale sim=2
    # or uncomment the deploy block below (requires NVIDIA toolkit).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

networks:
  aicar:
    driver: bridge
